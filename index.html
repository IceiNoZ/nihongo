<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本語">
<title>日本語 Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#07070f">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;--surface:#0f0f1a;--card:#13131f;--border:#23233a;--text:#eeeef8;--muted:#6a6a90;
  --green:#06d6a0;--red:#ff3c6e;--gold:#ffd166;--cyan:#00c8ff;
  --accent:#ff3c6e;--glow:rgba(255,60,110,.25);
  --jp:'Noto Sans JP',sans-serif;--mono:'Space Mono',monospace;--display:'Bebas Neue',sans-serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
body[data-tab="bases"]{--accent:#ff3c6e;--glow:rgba(255,60,110,.25)}
body[data-tab="kanji"]{--accent:#ff9f43;--glow:rgba(255,159,67,.25)}
body[data-tab="mots"]{--accent:#06d6a0;--glow:rgba(6,214,160,.25)}
body[data-tab="phrases"]{--accent:#54a0ff;--glow:rgba(84,160,255,.25)}
body[data-tab="manga"]{--accent:#e056fd;--glow:rgba(224,86,253,.25)}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,200,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.025) 1px,transparent 1px);background-size:36px 36px}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:max(.9rem,env(safe-area-inset-top)) 1rem 5rem}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.7rem}
.brand-eyebrow{display:none}
.brand h1{font-family:var(--display);font-size:clamp(1.7rem,6vw,2.3rem);letter-spacing:.05em;line-height:1}
.brand h1 span{color:var(--accent);transition:color .3s}
.head-btns{display:flex;gap:.4rem}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.5rem .65rem;font-size:.95rem;line-height:1;transition:all .15s}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}

/* main tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.3rem;margin-bottom:.6rem}
.tab{background:transparent;border:1px solid transparent;border-radius:7px;padding:.4rem .2rem;color:var(--muted);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;transition:all .2s}
.tab b{display:block;font-family:var(--jp);font-size:1.05rem;letter-spacing:0;margin-bottom:.1rem;font-weight:700}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}

/* chips */
.row{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin-bottom:.6rem}
.row-label{width:100%;text-align:center;font-size:.52rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin-bottom:-.1rem}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:.62rem;letter-spacing:.06em;padding:.38rem .8rem;transition:all .15s;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.active{color:#08080f;background:var(--accent);border-color:var(--accent);font-weight:700}
.chip.sub.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip .jp{font-family:var(--jp)}
.divider{height:1px;background:var(--border);margin:.4rem 0 .8rem}

/* score */
.score-bar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem .4rem;margin:.4rem 0 .7rem}
.score-item{text-align:center}
.score-label{font-size:.5rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.score-value{font-size:1.1rem;font-weight:700;margin-top:.1rem}
.c-green{color:var(--green)}.c-red{color:var(--red)}.c-gold{color:var(--gold)}
.lives{text-align:center;font-size:1.2rem;letter-spacing:.3rem;margin-bottom:.4rem}
.progress{height:3px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:1rem}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#fff8);transition:width .35s;width:0}
.timer{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:.6rem}
.timer>div{height:100%;width:100%;background:var(--green)}

/* card */
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem 1.1rem 1.2rem;text-align:center;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),#fff6)}
.q-meta{display:flex;justify-content:center;gap:.5rem;align-items:center;font-size:.52rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin-bottom:.4rem}
.badge{font-size:.55rem;letter-spacing:.12em;font-weight:700;padding:.15rem .5rem;border-radius:99px;border:1px solid currentColor}
.badge.N5{color:var(--green)}.badge.N4{color:var(--cyan)}.badge.plus,.badge.Manga{color:var(--gold)}
.prompt{font-family:var(--jp);line-height:1.2;margin:.2rem 0 .5rem;word-break:break-word;text-shadow:0 0 50px var(--glow)}
.prompt.xl{font-size:clamp(4.2rem,18vw,7rem)}
.prompt.lg{font-size:clamp(2.3rem,10vw,4rem)}
.prompt.md{font-size:clamp(1.4rem,5.5vw,2rem);line-height:1.6}
.prompt.sm{font-size:clamp(1.05rem,4.2vw,1.35rem);line-height:1.9}
.prompt.fr{font-family:var(--mono);font-size:clamp(1.05rem,4.5vw,1.4rem);line-height:1.5}
.prompt.pop{animation:pop .3s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.prompt .blank{color:var(--accent);border-bottom:2px solid var(--accent);padding:0 .3rem}
.prompt .hl{color:var(--accent)}
.context{font-family:var(--jp);font-size:.95rem;color:var(--muted);line-height:1.8;margin:-.1rem 0 .6rem}
.context .hl{color:var(--text);border-bottom:1px dashed var(--accent)}
.hint{font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
.q-label{font-size:.6rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:.4rem 0 .8rem}

.options{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.options.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.85rem .5rem;font-size:.92rem;font-weight:700;letter-spacing:.06em;transition:all .15s;min-height:3.1rem}
.opt.jp{font-family:var(--jp);font-size:1.35rem;letter-spacing:0}
.opt.jp.big{font-size:1.9rem}
.opt.long{font-family:var(--sans);font-weight:500;font-size:.95rem;letter-spacing:0;text-transform:none}
.opt.up{text-transform:uppercase}
.opt small{display:block;font-size:.68rem;font-weight:400;color:var(--cyan);margin-top:.25rem;letter-spacing:.06em}
.opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green)!important;background:rgba(6,214,160,.13)!important;color:var(--green)!important;animation:okpop .35s}
.opt.wrong{border-color:var(--red)!important;background:rgba(255,60,110,.13)!important;color:var(--red)!important;animation:shake .4s}
.opt.correct small,.opt.wrong small{color:inherit;opacity:.8}
@keyframes okpop{50%{transform:scale(1.05)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.type-wrap{display:flex;gap:.5rem}
.type-input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:1.05rem;padding:.8rem 1rem;outline:none}
.type-input:focus{border-color:var(--accent)}
.type-input.correct{border-color:var(--green);color:var(--green)}
.type-input.wrong{border-color:var(--red);color:var(--red);animation:shake .4s}
.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;font-family:var(--display);font-size:1.15rem;letter-spacing:.15em;padding:.75rem 1.1rem;transition:all .2s}
.btn:hover{background:var(--accent);color:#08080f}
.btn.full{width:100%}
.btn.sm{font-family:var(--sans);font-size:.85rem;letter-spacing:0;padding:.65rem .8rem;font-weight:600}
.btn.ghost{border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.ok{border-color:var(--green);color:var(--green)}.btn.ok:hover{background:var(--green);color:#000}
.btn.ko{border-color:var(--red);color:var(--red)}.btn.ko:hover{background:var(--red);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}

.reveal{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-top:.2rem;animation:fadeUp .2s}
.reveal-main{font-family:var(--jp);font-size:1.25rem;color:var(--accent)}
.reveal-sub{font-size:.75rem;color:var(--muted);margin-top:.3rem;letter-spacing:.06em}
.reveal-fr{font-size:.95rem;margin-top:.4rem;font-weight:700}

.feedback{margin-top:.9rem;font-family:var(--sans);font-size:.88rem;min-height:1.1em;line-height:1.5}
.feedback.ok{color:var(--green)}.feedback.ko{color:var(--red)}
.feedback .m{color:var(--gold)}
.explain{font-family:var(--sans);background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:8px;padding:.8rem 1rem;margin-top:.8rem;text-align:left;font-size:.78rem;line-height:1.6;animation:fadeUp .2s}
.explain .jp{font-family:var(--jp);font-size:.95rem}
.explain .t{font-family:var(--display);letter-spacing:.1em;font-size:1rem;color:var(--accent);display:block;margin-bottom:.2rem}
.next{margin-top:1rem;width:100%;display:none}
.next.show{display:block;animation:fadeUp .25s}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* result */
.result{text-align:center}
.result .emoji{font-size:3.4rem;margin-bottom:.4rem}
.result h2{font-family:var(--display);font-size:2.6rem;letter-spacing:.08em;color:var(--gold)}
.result .sub{font-family:var(--sans);font-size:.85rem;color:var(--muted);letter-spacing:.1em;margin:.4rem 0 1.4rem;line-height:1.8}
.result .sub b{color:var(--text)}
.err-list{text-align:left;margin:1rem 0;border-top:1px solid var(--border)}
.err-item{display:flex;gap:.9rem;align-items:center;padding:.6rem .2rem;border-bottom:1px solid var(--border);font-family:var(--sans);font-size:.85rem}
.err-item .k{font-family:var(--jp);font-size:1.4rem;min-width:3rem;text-align:center;color:var(--red)}
.err-item .r{color:var(--muted);font-size:.68rem}

/* study (histoires) */
.study-kanji{font-family:var(--jp);font-size:6rem;line-height:1;margin:.3rem 0 .8rem;text-shadow:0 0 60px var(--glow)}
.study-meta{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.85rem}
.study-meta .fr{color:var(--accent);font-weight:700}
.study-meta .rd{color:var(--muted)}
.mnemo{font-family:var(--sans);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.9rem 1rem;text-align:left;font-size:.82rem;line-height:1.6;margin-bottom:1rem}
.mnemo .lab{font-size:.55rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:.4rem}

/* manga */
.drop{border:2px dashed var(--border);border-radius:12px;padding:2rem 1rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop .big{font-size:2.4rem}
.drop h3{font-family:var(--display);font-size:1.4rem;letter-spacing:.1em;margin:.3rem 0}
.drop p{font-family:var(--sans);font-size:.8rem;color:var(--muted);line-height:1.55}
textarea.paste{width:100%;min-height:90px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--jp);font-size:.9rem;padding:.7rem;margin:.8rem 0 .5rem;outline:none;resize:vertical}
textarea.paste:focus{border-color:var(--accent)}
.status{font-family:var(--sans);font-size:.8rem;color:var(--muted);text-align:center;margin:.8rem 0;letter-spacing:.06em;line-height:1.6}
.status.err{color:var(--red)}
.vol{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.8rem}
.vol-info{flex:1;min-width:0}
.vol-title{font-family:var(--jp);font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol-stats{font-size:.6rem;color:var(--muted);letter-spacing:.06em;margin-top:.25rem}
.minibar{height:4px;background:var(--border);border-radius:99px;margin-top:.45rem;overflow:hidden}
.minibar>div{height:100%;background:var(--green)}
.small-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;font-size:.6rem;letter-spacing:.08em;padding:.4rem .6rem;white-space:nowrap}
.small-btn:hover{border-color:var(--accent);color:var(--accent)}
.small-btn.ok:hover{border-color:var(--green);color:var(--green)}
.small-btn.ko:hover{border-color:var(--red);color:var(--red)}
.vol-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.vol-head h2{font-family:var(--jp);font-size:1.1rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip{font-family:var(--sans);font-size:.78rem;color:var(--muted);line-height:1.55;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;margin-bottom:.7rem}
.tip b{color:var(--accent)}
.word{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem .85rem;margin-bottom:.45rem}
.word-top{display:flex;align-items:center;gap:.6rem}
.word-jp{font-family:var(--jp);font-size:1.35rem;font-weight:700}
.word-kana{font-family:var(--jp);font-size:.8rem;color:var(--muted)}
.word-count{margin-left:auto;font-size:.6rem;color:var(--gold);white-space:nowrap}
.word-ex{font-family:var(--jp);font-size:.78rem;color:var(--muted);margin:.35rem 0 .45rem;line-height:1.6}
.word-ex .hl{color:var(--text);border-bottom:1px dashed var(--accent)}
.word-bottom{display:flex;gap:.4rem;align-items:center}
.word-fr{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:.72rem;padding:.4rem .6rem;outline:none}
.word-fr:focus{border-color:var(--accent)}
.word.known{opacity:.55}
.state{font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .45rem;border-radius:99px;border:1px solid currentColor}
.state.new{color:var(--muted)}.state.learn{color:var(--gold)}.state.done{color:var(--green)}.state.ign{color:var(--red)}
.line{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;margin-bottom:.45rem;font-family:var(--jp);font-size:1.2rem;line-height:2.3}
.line .pg{font-family:var(--mono);font-size:.55rem;color:var(--muted);letter-spacing:.1em;display:block;line-height:1.4;margin-bottom:.1rem}
.tok{border-radius:3px;cursor:pointer}
.tok.k:hover,.tok.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.tok.learn{border-bottom:2px solid color-mix(in srgb,var(--accent) 70%,transparent)}
ruby rt{font-size:.5em;color:var(--accent)}
.pop-word{position:fixed;left:0;right:0;margin:0 auto;bottom:1rem;z-index:50;width:min(92vw,420px);background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:1rem 1.1rem;box-shadow:0 10px 40px var(--glow);display:none}
.pop-word.show{display:block;animation:fadeUp .2s}
.pop-word .pj{font-family:var(--jp);font-size:1.6rem}
.pop-word .pk{font-family:var(--jp);color:var(--accent);font-size:.9rem}
.pop-word .pf{font-size:.8rem;margin-top:.35rem}
.pop-word .x{position:absolute;top:.4rem;right:.6rem;background:none;border:none;color:var(--muted);font-size:1rem}
.empty{text-align:center;color:var(--muted);font-size:.75rem;padding:2rem 1rem;line-height:1.8}

/* progress screen */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none}
.overlay.show{display:block}
.overlay .app{padding-top:1.2rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem .3rem;text-align:center}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.5rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.sec-title{font-size:.58rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin:1rem 0 .5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:.25rem}
.cell{aspect-ratio:1;border-radius:5px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--jp);font-size:.95rem;background:var(--surface);color:var(--muted)}
.cell.w{font-size:.6rem;aspect-ratio:auto;padding:.35rem .1rem;overflow:hidden;white-space:nowrap}
.cell.l0{background:rgba(255,60,110,.15);border-color:var(--red);color:var(--red)}
.cell.l1{background:rgba(255,209,102,.13);border-color:var(--gold);color:var(--gold)}
.cell.l2{background:rgba(0,200,255,.13);border-color:var(--cyan);color:var(--cyan)}
.cell.l3{background:rgba(6,214,160,.16);border-color:var(--green);color:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:.8rem;font-size:.58rem;color:var(--muted);margin:.8rem 0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:.3rem;vertical-align:middle}
.hidden{display:none!important}

/* ── réglages repliables ── */
.setbar{width:100%;display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.55rem .8rem;font-size:.66rem;letter-spacing:.04em;color:var(--text);text-align:left;margin-bottom:.6rem}
.setbar .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setbar .sum .jp{font-family:var(--jp)}
.setbar .car{color:var(--accent);transition:transform .2s}
.setbar.open .car{transform:rotate(180deg)}
.setpanel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem .5rem .3rem;margin:-.3rem 0 .7rem;animation:fadeUp .2s}
.scoreline{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:700;padding:0 .3rem;margin:.1rem 0 .35rem}
.scoreline .t{color:var(--muted);font-weight:400}
.progress{margin-bottom:.6rem}
/* ── fond manga ── */
#mangaBg{position:fixed;inset:-40px;z-index:0;background-size:cover;background-position:center;filter:blur(16px) brightness(.3) saturate(1.15);opacity:0;transition:opacity .6s;pointer-events:none}
#mangaBg.show{opacity:1}
body[data-tab="manga"] .card,body[data-tab="manga"] .wrow,body[data-tab="manga"] .vol,body[data-tab="manga"] .tip,body[data-tab="manga"] .coverage{background:rgba(19,19,31,.86);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
/* ── bibliothèque ── */
.cover{width:46px;height:64px;border-radius:5px;background:var(--surface) center/cover;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--jp);color:var(--muted)}
.dict-row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.3rem;color:var(--text)}
.tip a{color:var(--accent)}
.vol-actions{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:1rem}

.wjp{font-family:var(--jp);font-size:1.12rem;font-weight:700;white-space:nowrap}

.reader-nav .btn{padding:.35rem 1.1rem;font-size:1.5rem;line-height:1}

.page-wrap{position:relative;container-type:inline-size;border-radius:6px;overflow:hidden;background:#fff;touch-action:pan-y}

.bub{position:absolute;color:transparent;font-family:var(--jp);line-height:1.15;overflow:hidden;cursor:pointer;border-radius:4px;border:1px solid transparent;transition:background .15s;white-space:normal;word-break:break-all}

.icon-btn{position:relative}
.icon-btn.sync[data-state="ok"]{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,var(--border))}

function romajiToKana(r) {
  r = r.toLowerCase().replace(/[\s'’.]/g, ''); let out = '', i = 0;
  while (i < r.length) {
    if (i + 1 < r.length && r[i] === r[i + 1] && !'aiueon-'.includes(r[i])) { out += 'っ'; i++; continue; }
    if (r[i] === 'n' && (i + 1 === r.length || !'aiueoy'.includes(r[i + 1]))) { out += 'ん'; i += (r[i + 1] === 'n' ? 2 : 1); continue; }
    let hit = false;
    for (const L of [3, 2, 1]) { const s = r.slice(i, i + L); if (R2K[s]) { out += R2K[s]; i += L; hit = true; break; } }
    if (!hit) { out += r[i]; i++; }
  }
  return out;
}
const kataToHira = s => (s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

function normKana(s) {

  for (const c of s) out += (c === 'ー' && out) ? (VOWEL_OF[out[out.length - 1]] || '') : c;
  return out.replace(/ぢ/g, 'じ').replace(/づ/g, 'ず').replace(/を/g, 'お');
}
const toKana = input => /[぀-ヿ]/.test(input) ? input : romajiToKana(input);
const K2R = (() => {
  const m = {}; for (const [r, k] of Object.entries(R2K)) if (!m[k]) m[k] = r;

function romajiOf(k) {
  const s = normKana(k); let out = '', i = 0;
  while (i < s.length) {

    if (two.length === 2 && K2R[two]) { out += K2R[two]; i += 2; continue; }
    if (c === 'っ') { const nx = K2R[s.slice(i + 1, i + 3)] || K2R[s[i + 1]] || ''; out += nx ? (nx.startsWith('ch') ? 't' : nx[0]) : ''; i++; continue; }

// ═════════════ RÉGLAGES ═════════════
const S = Object.assign({
  tab: 'bases',
  bases: { set: 'kata', group: 'all', dir: 'toRomaji' },
  kanji: { set: 'kanji', lvl: 'all', dir: 'toFr' },
  mots: { set: 'hira', dir: 'toFr' },

const saveSettings = () => store('nihongo_settings', S);

function speak(text) {

<script>
// ═════════════ MOTEUR DE QUIZ ═════════════
const TOTAL = 20, CHRONO_S = 8;
let Q = null; // session en cours

function orderItems(items, keyFn) {
  if (!S.smart) return shuffle(items);
  const now = Date.now(), due = [], weak = [], fresh = [], rest = [];
  for (const it of shuffle(items)) {
    const e = SRS[keyFn(it)];
    if (!e || e.c + e.w === 0) { if (!e || !e.known) fresh.push(it); else rest.push(it); }
    else if (e.lvl < 6 && e.due <= now) (e.lvl <= 1 ? weak : due).push(it);
    else rest.push(it);
  }
  due.sort((a, b) => (SRS[keyFn(a)].due - SRS[keyFn(b)].due));
  return [...weak, ...due, ...fresh, ...rest];
}

function startQuiz(source, opts = {}) {
  const target = opts.target || $('view');
  stopTimer();
  if (!source || !source.items.length) { Q = null; target.innerHTML = `<div class="empty">Rien à réviser ici pour l'instant.</div>`; return; }
  const kf = source.keyOf || (it => source.make(it).key);
  const ordered = opts.fixed ? shuffle(source.items) : (opts.keepOrder ? [...source.items] : orderItems(source.items, kf));
  const game = opts.game || S.game;
  const endless = game === 'libre' || game === 'survie';
  Q = { source, game, kf, opts, target, queue: ordered, endless, total: endless ? Infinity : Math.min(opts.fixed ? ordered.length : TOTAL, ordered.length),
        i: 0, correct: 0, wrong: 0, streak: 0, best: 0, lives: 3, mistakes: [], answered: false, timer: null, cur: null };
  renderQuizShell(target);

}

function renderQuizShell(target) {
  const g = Q.game;
  target.innerHTML = `
    ${g === 'survie' ? '<div class="lives" id="lives"></div>' : ''}
    ${g === 'chrono' ? '<div class="timer"><div id="timerBar"></div></div>' : ''}
    <div class="scoreline"><span class="c-green">✓ <span id="sC">0</span></span><span class="c-red">✗ <span id="sW">0</span></span><span class="c-gold">🔥 <span id="sS">0</span></span><span class="t" id="sT">0</span></div>
    ${Q.endless ? '' : '<div class="progress"><div id="pBar"></div></div>'}
    <div class="card" id="card"></div>`;
  updateScore();
}
function updateScore() {
  $('sC').textContent = Q.correct; $('sW').textContent = Q.wrong; $('sS').textContent = Q.streak;
  $('sT').textContent = Q.endless ? Q.i : `${Math.min(Q.i, Q.total)}/${Q.total}`;
  if ($('pBar')) $('pBar').style.width = (Q.i / Q.total * 100) + '%';
  if ($('lives')) $('lives').textContent = [0, 1, 2].map(i => i < Q.lives ? '❤️' : '🖤').join(' ');
}

function nextQuestion(first) {
  stopTimer();
  if (!first) Q.i++;
  if (Q.game === 'survie' && Q.lives <= 0) return showResult();
  if (!Q.endless && Q.i >= Q.total) return showResult();
  if (Q.endless && Q.i >= Q.queue.length) Q.queue.push(...(Q.opts.keepOrder ? shuffle(Q.source.items) : orderItems(Q.source.items, Q.kf)));
  const item = Q.queue[Q.i];

function metaHTML(q) {

  let badge = '';
  if (q.meta && q.meta.lvl) badge = `<span class="badge ${q.meta.lvl === '+' ? 'plus' : q.meta.lvl}">${q.meta.lvl === '+' ? 'Au-delà N4' : q.meta.lvl}</span>`;

function renderQuestion(q) {

    ${q.visual ? '<div id="qVisual"></div>' : ''}
    <div class="prompt ${q.pClass} pop${S.tab !== 'bases' && !q.accept ? ' kh' : ''}" id="prompt">${q.html ? q.prompt : esc(q.prompt)}</div>
    ${q.context ? `<div class="context kh">${q.context}</div>` : ''}

    ${q.hint && q.accept ? `<div class="hint">sens : ${esc(q.hint)}</div>` : ''}
    <div class="q-label">${flash ? 'Réfléchis, puis révèle la réponse' : esc(q.label)}</div>
    <div id="answerZone"></div>
    <div class="feedback" id="fb"></div>
    <div id="explain"></div>
    <button class="btn next" id="nextBtn">${(!Q.endless && Q.i + 1 >= Q.total) ? 'Voir le résultat →' : 'Suivant →'}</button>`;
  $('nextBtn').onclick = () => nextQuestion();
  const zone = $('answerZone');
  if (flash) {
    zone.innerHTML = `<button class="btn ghost full" id="revealBtn">👁 Révéler</button>`;
    $('revealBtn').onclick = () => flashReveal(q);
  } else if (q.accept) {
    zone.innerHTML = `<div class="type-wrap"><input class="type-input" id="typeIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="romaji ou kana…"><button class="btn" id="typeOk">OK</button></div>`;
    $('typeOk').onclick = submitTyped;

      `<button class="opt ${q.optClass || ''}" data-i="${i}">${esc(o.t)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}</div>`;

function flashReveal(q) {

  $('answerZone').innerHTML = `<div class="reveal"><div class="reveal-main">${esc(r.main)}</div>${r.sub ? `<div class="reveal-sub">${esc(r.sub)}</div>` : ''}${r.fr ? `<div class="reveal-fr">${esc(r.fr)}</div>` : ''}</div>
    <div class="btn-row"><button class="btn ko" id="fNo">✗ Je savais pas</button><button class="btn ok" id="fYes">✓ Je savais</button></div>`;

function startTimer() {

  const errs = Q.mistakes.map(it => { const q = Q.source.make(it); const main = q.pClass === 'fr' ? (q.options.find(o => o.ok)?.t || '') : (q.html ? it.answer : q.prompt);

    <div class="btn-row">${errs ? '<button class="btn ko" id="rRetry">↺ Refaire les erreurs</button>' : ''}<button class="btn" id="rNew" ${errs ? '' : 'style="grid-column:1/-1"'}>→ Nouvelle session</button></div></div>`;
  if ($('pBar')) $('pBar').style.width = '100%';

// clavier : 1-4 pour répondre, Entrée / Espace pour continuer
document.addEventListener('keydown', e => {
  if (!Q || !$('card') || e.target.matches('input, textarea')) return;
  if (/^[1-4]$/.test(e.key) && !Q.answered) { const b = document.querySelectorAll('#answerZone .opt')[+e.key - 1]; if (b) b.click(); }
  if (e.key === 'Enter' || e.key === ' ') {
    const nb = $('nextBtn'), rv = $('revealBtn');
    if (nb && nb.classList.contains('show')) { e.preventDefault(); nb.click(); }

});

function analysePages(tokenizer, pages, onProgress) {

async function fetchBytes(url, onBytes, stallMs = 25000) {
  const ctl = new AbortController(); let timer;
  const arm = () => { clearTimeout(timer); timer = setTimeout(() => ctl.abort(), stallMs); };
  arm();

    const r = await fetch(url, { signal: ctl.signal });

function glossList(arr) {
  const out = [];
  const deep = n => n == null ? '' : typeof n === 'string' ? n : Array.isArray(n) ? n.map(deep).join('') : n.type === 'image' ? '' : deep(n.text !== undefined ? n.text : n.content);

    if (n.type === 'structured-content') return walk(n.content, inG);
    const isG = n.data && n.data.content === 'glossary';
    if (n.tag === 'li' && (inG || isG)) { const t = deep(n.content).trim(); if (t) out.push(t); return; }
    walk(n.content, inG || isG);

  for (const g of arr || []) {
    if (typeof g === 'string') out.push(g);

    else walk(g, false);
  }
  if (!out.length) (arr || []).forEach(g => { const t = typeof g === 'string' ? g : deep(g); if (t) out.push(t.trim()); });
  return out;
}

function lookupMany(words) {
  return new Promise((res, rej) => {
    if (!DICTS.length || !IDB.db) return res(new Map());
    const prio = new Map(DICTS.map((d, i) => [d.id, i]));
    const tx = IDB.db.transaction('dict', 'readonly'), st = tx.objectStore('dict'), ie = st.index('e'), ir = st.index('r');
    const out = new Map();
    const choose = (list, kana) => {
      if (!list.length) return '';
      const same = list.filter(x => x.r === kana); if (same.length) list = same;
      list.sort((a, b) => (prio.get(a.d) ?? 9) - (prio.get(b.d) ?? 9));
      const d0 = list[0].d, parts = [];
      for (const x of list) { if (x.d !== d0) break; if (!parts.includes(x.g)) parts.push(x.g); if (parts.join(' ; ').length > 90) break; }
      return parts.join(' ; ').slice(0, 130);

    for (const w of words) {
      const q = ie.getAll(w.jp);
      q.onsuccess = () => {
        if (q.result.length || hasKanji(w.jp)) out.set(w.jp, choose(q.result, normKana(w.kana) === normKana(w.jp) ? kataToHira(w.jp) : w.kana));

}

async function handleFiles(fileList, intoVol) {

    const files = await expandFiles([...fileList]);
    const imgs = files.filter(x => IMG_RE.test(x.name));

      setStatus('Préparation des images…');
      const n = await attachImages(intoVol, imgs);
      setStatus(n ? `${n} pages ajoutées.` : 'Aucune image reconnue.', !n); renderManga(); return;
    }
    const mokFiles = files.filter(x => /\.mokuro$/i.test(x.name) || (/\.json$/i.test(x.name) && !/[\\/]_ocr[\\/]/.test(x.name)));
    let pages = null, title = '';
    for (const m of mokFiles) {
      try { const obj = JSON.parse(await m.file.text()); const p = parseMokuro(obj); if (p.length) { pages = p; title = [obj.title, obj.volume].filter(Boolean).join(' — ') || baseName(m.name); break; } } catch (e) { }

  setStatus('Analyse du texte…'); await new Promise(r => setTimeout(r, 30));
  const words = (await analysePagesAsync(tk, pages, (i, n) => setStatus(`Analyse du texte : page ${i} / ${n}…`))).map(w => ({ jp: w.jp, kana: w.kana, n: w.n, f: w.f, ex: w.ex, fr: '' }));
  const prev = new Map(); LIB.forEach(v => v.words.forEach(w => { if (w.fr) prev.set(w.jp, w.fr); if (w.ign) prev.set('!' + w.jp, 1); }));
  words.forEach(w => { if (prev.has(w.jp)) w.fr = prev.get(w.jp); if (prev.has('!' + w.jp)) w.ign = true; });
  const v = { id: Date.now(), title, date: Date.now(), hasImg: 0, last: 0, pages, words };
  LIB.unshift(v); await saveVol(v);
  if (DICTS.length) { setStatus('Ajout des sens depuis le dictionnaire…'); await fillMeanings(v); }
  if (imgs && imgs.length) { setStatus('Préparation des images…'); await attachImages(v, imgs); }
  M = Object.assign(M, { vol: v.id, view: 'words', filter: 'learn', shown: 50, upTo: 0, open: -1 });
  renderManga();
}

function renderVolume(v) {
  M.go = null;
  const s = volStats(v);
  $('view').innerHTML = `
    <div class="vol-head"><button class="small-btn" id="back">←</button><h2>${esc(v.title)}</h2></div>
    <div class="coverage"><div class="cov-top"><b>${s.cov} %</b> des mots de ce tome connus${s.to90 ? ` · encore <b>${s.to90}</b> mots pour 90 %` : ' · objectif 90 % atteint 🎉'}</div>
      <div class="minibar"><div style="width:${s.cov}%"></div></div></div>
    <div class="row">${chip('📋 Mots', M.view === 'words', 'm:words')}${chip('🃏 Réviser', M.view === 'review', 'm:review')}${chip('📖 Lire', M.view === 'read', 'm:read')}</div>
    <div id="mBody"></div>
    <div class="vol-actions"><button class="small-btn" id="exportAnki">⬇ Export Anki</button>
      <button class="small-btn" id="addImgs">🖼 ${hasImages(v) ? 'Remplacer les images' : 'Ajouter les images'}</button>
      ${hasImages(v) ? '<button class="small-btn" id="pickBg">🎨 Fond</button>' : ''}
      ${DICTS.length ? '<button class="small-btn" id="refillDict">📚 Recharger les sens</button>' : ''}
      <input type="file" id="imgIn" multiple accept="image/*,.zip,.cbz" hidden></div>
    <div class="status" id="mStatus"></div>`;
  $('back').onclick = () => { M.vol = null; renderManga(); };
  $('view').querySelectorAll('.row [data-act]').forEach(b => b.onclick = () => { M.view = b.dataset.act.slice(2); M.open = -1; renderVolume(v); });
  $('exportAnki').onclick = () => exportAnki(v);
  if ($('pickBg')) $('pickBg').onclick = () => openBgPicker(v);
  $('addImgs').onclick = () => $('imgIn').click();
  $('imgIn').onchange = e => e.target.files.length && handleFiles(e.target.files, v);
  if ($('refillDict')) $('refillDict').onclick = async () => { setStatus('Recherche des sens…'); const n = await fillMeanings(v, true); setStatus(`${n} mots ont un sens.`); renderVolume(v); };
  if (M.view === 'words') renderWords(v, s);
  else if (M.view === 'review') renderReview(v);
  else renderRead(v);
}

function renderWords(v, s) {
  const f = M.filter;
  const list = v.words.filter(w => { const st = wordState(w); return f === 'all' ? st !== 'ign' : f === 'learn' ? (st === 'new' || st === 'learn') : st === f; });
  const body = $('mBody');
  body.innerHTML = `
    <div class="row">${[['learn', `À apprendre ${s.new + s.learn}`], ['done', `Connus ${s.done}`], ['ign', `Ignorés ${s.ign}`], ['all', 'Tous']].map(([k, l]) => chip(l, f === k, 'f:' + k, 'sub')).join('')}</div>
    <div class="tip">Du plus fréquent au plus rare. Touche un mot pour voir sa bulle et noter son sens. <b>✓</b> = je le connais, <b>✕</b> = erreur du scan.${DICTS.length ? '' : ' Importe un dictionnaire (bibliothèque) pour avoir les sens automatiquement.'}</div>
    <div id="wList"></div>`;
  body.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { M.filter = b.dataset.act.slice(2); M.shown = 50; M.open = -1; renderVolume(v); });
  const wl = $('wList');
  if (!list.length) { wl.innerHTML = '<div class="empty">Aucun mot dans cette liste.</div>'; return; }
  wl.innerHTML = list.slice(0, M.shown).map(w => {
    const st = wordState(w), i = v.words.indexOf(w), open = M.open === i, ex = w.ex && w.ex[0];
    return `<div class="wrow ${st}${open ? ' open' : ''}" data-i="${i}">
      <div class="wline" data-tog="${i}"><span class="dot ${st}"></span><span class="wjp kh">${esc(w.jp)}</span>${hasKanji(w.jp) ? `<span class="wkana">${esc(w.kana)}</span>` : ''}
        <span class="wfr">${esc(meaning(w))}</span><span class="wn">×${w.n}</span>
        ${st === 'done' ? `<button class="ib" data-unk="${i}" title="À revoir">↺</button>` : `<button class="ib ok" data-kn="${i}" title="Je connais">✓</button>`}
        ${st === 'ign' ? `<button class="ib" data-unig="${i}" title="Rétablir">↺</button>` : `<button class="ib ko" data-ig="${i}" title="Ignorer">✕</button>`}</div>
      ${open ? `<div class="wmore"><div class="crop-slot" id="wcrop"></div>${ex ? `<div class="word-ex kh">${hlExample(ex)}${v.pages.length > 1 ? ` <span class="pgn">p.${ex.p + 1}</span>` : ''}</div>` : ''}
        ${w.d ? `<div class="wdict">📚 ${esc(w.d)}</div>` : ''}
        <input class="word-fr" data-fr="${i}" value="${esc(w.fr)}" placeholder="${w.d ? 'ton sens à toi (facultatif)' : 'sens (depuis Yomitan ou ta tête)'}"></div>` : ''}</div>`;
  }).join('');
  if (list.length > M.shown) { wl.insertAdjacentHTML('beforeend', `<button class="btn ghost full" id="more">Afficher plus (${list.length - M.shown})</button>`); $('more').onclick = () => { M.shown += 100; renderVolume(v); }; }
  if (M.open >= 0) fillCrop($('wcrop'), v, v.words[M.open].ex && v.words[M.open].ex[0]);
  wl.querySelectorAll('[data-tog]').forEach(el => el.onclick = e => { if (e.target.closest('button')) return; const i = +el.dataset.tog; M.open = M.open === i ? -1 : i; renderVolume(v); if (M.open >= 0) speak(v.words[i].jp); });
  wl.querySelectorAll('[data-fr]').forEach(inp => inp.onchange = () => { v.words[+inp.dataset.fr].fr = inp.value.trim(); saveVol(v); });
  const after = fn => b => b.onclick = e => { e.stopPropagation(); fn(+b.dataset[Object.keys(b.dataset)[0]]); renderVolume(v); };
  wl.querySelectorAll('[data-kn]').forEach(after(i => srsMark(mKey(v.words[i]), true)));
  wl.querySelectorAll('[data-unk]').forEach(after(i => srsMark(mKey(v.words[i]), false)));
  wl.querySelectorAll('[data-ig]').forEach(after(i => { v.words[i].ign = true; saveVol(v); }));
  wl.querySelectorAll('[data-unig]').forEach(after(i => { delete v.words[i].ign; saveVol(v); }));
}

function mangaSource(v, mode) {
  let items = v.words.filter(w => { const st = wordState(w); return (st === 'new' || st === 'learn') && (!M.upTo || w.f < M.upTo); });
  if (mode === 'reading' || mode === 'type') items = items.filter(w => hasKanji(w.jp));
  if (mode === 'meaning') items = items.filter(w => meaning(w));
  const now = Date.now();
  const rank = w => { const e = SRS[mKey(w)]; if (!e || e.c + e.w === 0) return 2; if (e.due <= now) return e.lvl <= 1 ? 0 : 1; return 3; };
  items = [...items].sort((a, b) => rank(a) - rank(b) || b.n - a.n);
  const pool = mode === 'meaning' ? v.words.filter(w => meaning(w)) : v.words.filter(w => hasKanji(w.jp));
  return {
    items, pool, name: v.title, keyOf: mKey, restart: () => renderVolume(v),
    make: w => {
      const ex = w.ex && w.ex[0];
      const base = { key: mKey(w), prompt: w.jp, pClass: w.jp.length > 4 ? 'md' : 'lg', context: ex ? hlExample(ex) : '', speakText: w.jp,
        visual: ex && ex.b >= 0 && hasImages(v) ? el => fillCrop(el, v, ex, 150) : null };
      const m = meaning(w), rd = `${w.kana} · ${romajiOf(w.kana)}`;
      if (mode === 'reading') return Object.assign(base, { label: 'Comment se lit ce mot ?', options: optionsFrom(w, pool, x => x.kana), optClass: 'jp', after: `${w.jp} — ${w.kana}${m ? ' · ' + m : ''}` });
      if (mode === 'type') return Object.assign(base, { label: 'Tape la lecture (romaji ou kana)', accept: new Set([normKana(w.kana)]), answerText: rd + (m ? ' — ' + m : '') });
      if (mode === 'meaning') return Object.assign(base, { label: 'Que veut dire ce mot ?', options: optionsFrom(w, pool, x => meaning(x)), optClass: 'long', after: `${w.jp} (${w.kana}) — ${m}` });
      return Object.assign(base, { label: '', reveal: { main: hasKanji(w.jp) ? w.kana : w.jp, sub: romajiOf(w.kana) + ` · vu ${w.n} fois`, fr: m },
        explainHTML: m ? '' : `Pas encore de sens : importe un dictionnaire, ou note-le dans la liste des mots.` });
    }
  };
}

function renderReview(v) {
  const body = $('mBody');
  const modes = [['flash', '🃏 Cartes'], ['reading', 'Lecture QCM'], ['type', '✍ Lecture'], ['meaning', 'Sens QCM']];
  const np = v.pages.length;
  body.innerHTML = `<div class="row">${modes.map(([k, l]) => chip(l, M.rev === k, 'r:' + k, 'sub')).join('')}</div>
    ${np > 1 ? `<div class="upto">Mots qui apparaissent avant la page <input type="number" id="upTo" min="0" max="${np}" value="${M.upTo || ''}" placeholder="toutes"> <span>/ ${np}</span></div>` : ''}
    <div id="revZone"></div>`;
  body.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { M.rev = b.dataset.act.slice(2); renderVolume(v); });
  if ($('upTo')) $('upTo').onchange = e => { M.upTo = Math.max(0, Math.min(np, +e.target.value || 0)); renderVolume(v); };
  const src = mangaSource(v, M.rev), need = M.rev === 'flash' ? 1 : 4;
  if (!src.items.length || src.pool.length < need) {
    const why = !src.items.length && M.rev === 'flash' ? (M.upTo ? 'Tous les mots de ces pages sont connus. Passe aux suivantes !' : 'Tous les mots de ce tome sont connus ou ignorés. Bravo !')
      : M.rev === 'meaning' ? 'Il faut au moins 4 mots avec un sens : importe un dictionnaire ou note des sens.' : 'Pas assez de mots en kanji à apprendre pour ce mode.';
    $('revZone').innerHTML = `<div class="empty">${why}</div>`; return;
  }
  startQuiz(src, { game: M.rev === 'flash' ? 'flash' : 'normal', target: $('revZone'), keepOrder: true });
}

function exportAnki(v) {
  const rows = v.words.filter(w => { const st = wordState(w); return st === 'new' || st === 'learn'; })
    .map(w => { const ex = w.ex && w.ex[0]; const sent = ex ? ex.s.replace(ex.w, `<b>${ex.w}</b>`) : '';
      return [w.jp, w.kana, meaning(w), sent, `${v.title}${ex && v.pages.length > 1 ? ' p.' + (ex.p + 1) : ''}`].map(x => String(x).replace(/[\t\n]/g, ' ')).join('\t'); });
  if (!rows.length) return setStatus('Aucun mot à exporter.', true);
  const blob = new Blob(['#separator:tab\n#html:true\n' + rows.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${v.title.replace(/[\\/:*?"<>|]/g, '_')}-anki.txt`; a.click(); URL.revokeObjectURL(a.href);
  setStatus(`${rows.length} mots exportés. Dans Anki : Fichier → Importer, puis choisis ce fichier.`);
}

// ── Lecture : vraies pages avec bulles cliquables, ou liste de bulles ──
function renderRead(v) {
  if (hasImages(v)) return renderPage(v);
  const all = []; v.pages.forEach((pg, p) => pg.blocks.forEach((b, bi) => all.push([p, bi])));
  const per = 15, pages = Math.ceil(all.length / per) || 1;
  M.lp = Math.min(M.lp || 0, pages - 1);
  const slice = all.slice(M.lp * per, M.lp * per + per);
  const ann = S.annot || 'kana';
  $('mBody').innerHTML = `<div class="row">${chip('あ Furigana', ann === 'kana', 'an:kana', 'sub')}${chip('a Romaji', ann === 'romaji', 'an:romaji', 'sub')}${chip('— Rien', ann === 'none', 'an:none', 'sub')}</div>
    <div class="tip">Lis chaque bulle à voix haute. Touche une bulle pour voir le sens de ses mots. ${v.pages.length > 1 ? 'Ajoute les images du volume pour lire les vraies pages.' : ''}</div>
    ${slice.map(([p, bi]) => `<div class="line kh" data-p="${p}" data-b="${bi}">${v.pages.length > 1 ? `<span class="pg">page ${p + 1}</span>` : ''}${tokensHTML(v, v.pages[p].blocks[bi], ann)}</div>`).join('')}
    <div class="btn-row"><button class="btn ghost" id="lPrev" ${M.lp === 0 ? 'disabled' : ''}>← Précédent</button><button class="btn ghost" id="lNext" ${M.lp >= pages - 1 ? 'disabled' : ''}>Suivant →</button></div>
    <div class="status">${M.lp + 1} / ${pages}</div>`;
  $('mBody').querySelectorAll('[data-act^="an:"]').forEach(b => b.onclick = () => { S.annot = b.dataset.act.slice(3); saveSettings(); renderVolume(v); });
  $('lPrev').onclick = () => { M.lp--; renderVolume(v); scrollTo(0, 0); };
  $('lNext').onclick = () => { M.lp++; renderVolume(v); scrollTo(0, 0); };
  $('mBody').querySelectorAll('.line').forEach(el => el.onclick = () => openSheet(v, +el.dataset.p, +el.dataset.b));
}
function tokensHTML(v, b, mode) {
  if (mode === true) mode = 'kana'; if (mode === false) mode = 'none';
  const learn = new Set(v.words.filter(w => { const s = wordState(w); return s === 'new' || s === 'learn'; }).map(w => w.jp));
  return (b.t || []).map(([surf, rd, base]) => {
    let inner = esc(surf);
    if (mode === 'kana' && rd) inner = `<ruby>${esc(surf)}<rt>${esc(rd)}</rt></ruby>`;
    else if (mode === 'romaji') { const k = rd || (/[\u3040-\u30FF]/.test(surf) ? surf : ''); if (k) inner = `<ruby>${esc(surf)}<rt class="ro">${esc(romajiOf(kataToHira(k)))}</rt></ruby>`; }
    return `<span class="tok${base && learn.has(base) ? ' learn' : ''}">${inner}</span>`;
  }).join('');
}
function renderPage(v) {
  const n = v.pages.length; M.page = Math.min(Math.max(0, M.page ?? v.last ?? 0), n - 1);
  const p = M.page, pg = v.pages[p];
  const boxes = pg.w ? pg.blocks.map((b, bi) => {
    if (!b.box) return '';
    const [x1, y1, x2, y2] = b.box, fs = b.fs ? (b.fs / pg.w * 100).toFixed(2) : 2.4;
    return `<div class="bub${b.v ? ' vert' : ''}" data-b="${bi}" style="left:${x1 / pg.w * 100}%;top:${y1 / pg.h * 100}%;width:${(x2 - x1) / pg.w * 100}%;height:${(y2 - y1) / pg.h * 100}%;font-size:max(9px,${fs}cqw)">${esc(blockText(b))}</div>`;
  }).join('') : '';
  $('mBody').innerHTML = `
    <div class="reader-nav"><button class="btn ghost" id="pPrev" ${p === 0 ? 'disabled' : ''}>‹</button><span>page ${p + 1} / ${n}</span><button class="btn ghost" id="pNext" ${p >= n - 1 ? 'disabled' : ''}>›</button></div>
    <div class="page-wrap" id="pageWrap" ${pg.w ? `style="aspect-ratio:${pg.w}/${pg.h}"` : ''}><img id="pageImg" alt="page ${p + 1}">${boxes}</div>
    <div class="tip" style="margin-top:.6rem">Touche une bulle pour voir le texte avec furigana et le sens des mots. Sur PC, <b>Shift + survol</b> d'une bulle marche aussi avec Yomitan. Glisse ou utilise ← → pour tourner les pages.</div>`;
  pageURL(v, p).then(u => { const im = $('pageImg'); if (im && u) im.src = u; });
  pageURL(v, p + 1);
  const go = d => { const np = Math.min(Math.max(0, p + d), n - 1); if (np === p) return; M.page = np; v.last = np; saveVol(v); hideSheet(); renderVolume(v); };
  $('pPrev').onclick = () => go(-1); $('pNext').onclick = () => go(1);
  $('mBody').querySelectorAll('.bub').forEach(el => el.onclick = () => openSheet(v, p, +el.dataset.b));
  const wrap = $('pageWrap'); let sx = null;
  wrap.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  wrap.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60) go(dx > 0 ? 1 : -1); });
  M.go = go;
}

function openSheet(v, p, bi) {
  const b = v.pages[p].blocks[bi]; if (!b) return;
  const words = new Map(v.words.map((w, i) => [w.jp, i]));
  const ids = [...new Set((b.t || []).map(t => t[2]).filter(x => x && words.has(x)))];
  const draw = () => {
    $('sheetContent').innerHTML = `<div class="sheet-text kh">${tokensHTML(v, b, S.annot || 'kana')}</div>
      <div class="sh-tools"><button class="small-btn" id="shAnnot">${{ kana: 'あ Furigana', romaji: 'a Romaji', none: '— Rien' }[S.annot || 'kana']}</button><button class="small-btn" id="shSpeak">🔊 Écouter</button><button class="small-btn" id="shCopy">📋 Copier</button></div>
      <div class="hint" style="text-align:left">Touche un kana pour voir sa lecture.</div>
      ${ids.length ? ids.map(jp => { const i = words.get(jp), w = v.words[i], st = wordState(w);
        return `<div class="sh-word"><div class="sh-top"><span class="dot ${st}"></span><b class="wjp kh">${esc(w.jp)}</b>${hasKanji(w.jp) ? `<span class="wkana">${esc(w.kana)}</span>` : ''}<span class="wn">×${w.n}</span></div>
        <div class="sh-fr">${esc(meaning(w)) || '<span style="color:var(--muted)">pas de sens (importe un dictionnaire)</span>'}</div>
        <div class="sh-btns">${st === 'done' ? `<button class="small-btn" data-sx="unk" data-i="${i}">↺ À revoir</button>` : `<button class="small-btn ok" data-sx="kn" data-i="${i}">✓ Je connais</button>`}
          ${st === 'new' ? `<button class="small-btn" data-sx="add" data-i="${i}">＋ À apprendre</button>` : st === 'learn' ? '<span class="state learn">en révision</span>' : ''}</div></div>`; }).join('')
        : '<div class="empty" style="padding:.6rem">Pas de mot à apprendre dans cette bulle.</div>'}`;
    $('shAnnot').onclick = () => { S.annot = { kana: 'romaji', romaji: 'none', none: 'kana' }[S.annot || 'kana']; saveSettings(); draw(); };
    $('shSpeak').onclick = () => { const was = S.audio; S.audio = true; speak(blockText(b)); S.audio = was; };
    $('shCopy').onclick = () => navigator.clipboard && navigator.clipboard.writeText(blockText(b));
    $('sheetContent').querySelectorAll('[data-sx]').forEach(btn => btn.onclick = () => {
      const w = v.words[+btn.dataset.i], k = mKey(w), a = btn.dataset.sx;
      if (a === 'kn') srsMark(k, true); else if (a === 'unk') srsMark(k, false);
      else { const e = SRS[k] || (SRS[k] = { c: 0, w: 0, lvl: 0, due: 0 }); e.add = true; e.due = 0; e.t = Date.now(); saveSRS(); }
      M.sheetDirty = true; draw();
    });
  };
  draw(); $('sheet').classList.add('show');
}
function hideSheet() { const s = $('sheet'); if (s) s.classList.remove('show'); }
function closeSheet() { hideSheet(); if (M.sheetDirty) { M.sheetDirty = false; const v = LIB.find(x => x.id === M.vol); if (v && S.tab === 'manga') { const y = scrollY; renderVolume(v); scrollTo(0, y); } } }
function hidePop() { hideSheet(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (S.tab === 'manga' && M.view === 'read' && M.go && !e.target.matches('input, textarea')) { if (e.key === 'ArrowRight') M.go(1); if (e.key === 'ArrowLeft') M.go(-1); }
});

</script>
<script>
// ═════════════ SYNCHRONISATION (dépôt GitHub privé) ═════════════
// Contenu du dépôt : nihongo/progress.json · nihongo/library.json · nihongo/vols/<id>.json
//                    nihongo/vols/<id>-p<k>.zip (pages par paquets de 50) · nihongo/vols/<id>-bg.jpg · nihongo/dicts/<id>.zip
const SYNC = Object.assign({ token: '', repo: '', last: 0, device: '' }, load('nihongo_sync', {}));
if (!SYNC.device) {
  const ua = navigator.userAgent;
  SYNC.device = (/iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Mac/.test(ua) ? 'Mac' : /Android/.test(ua) ? 'Android' : 'PC') + '-' + Math.random().toString(36).slice(2, 6);
  store('nihongo_sync', SYNC);
}
const syncOn = () => !!(SYNC.token && SYNC.repo);
const repoPath = () => SYNC.repo.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, '');
const PER_PART = 50;
let syncTimer = null, syncRunning = null, remoteTree = null, syncMsg = '';

function setSyncState(state, msg) {
  const b = $('btnSync'); if (b) b.dataset.state = state;
  if (msg) syncMsg = msg;
  const st = $('syncStatus'); if (st) { st.textContent = syncMsg; st.className = 'status' + (state === 'err' ? ' err' : ''); }
}
async function gh(path, { method = 'GET', body, raw, text } = {}) {
  const r = await fetch('https://api.github.com' + path, {
    method, cache: 'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + SYNC.token.trim(), Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) { } const err = new Error(m || ('HTTP ' + r.status)); err.status = r.status; throw err; }
  if (raw) return text ? r.text() : r.arrayBuffer();
  return r.status === 204 ? null : r.json();
}
const b64OfBlob = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
const jsonBlob = o => new Blob([JSON.stringify(o)], { type: 'application/json' });
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

async function loadRemote() {
  const R = repoPath();
  const repo = await gh(`/repos/${R}`);
  if (repo.private === false) { const e = new Error('public'); e.status = 'public'; throw e; }
  const branch = repo.default_branch || 'main';
  let ref;
  try { ref = await gh(`/repos/${R}/git/ref/heads/${branch}`); }
  catch (e) {
    if (e.status !== 409 && e.status !== 404) throw e;
    await gh(`/repos/${R}/contents/README.md`, { method: 'PUT', body: { message: 'init', content: btoa('Donnees du quiz nihongo (ne pas rendre public)'), branch } });
    ref = await gh(`/repos/${R}/git/ref/heads/${branch}`);
  }
  const head = ref.object.sha, commit = await gh(`/repos/${R}/git/commits/${head}`);
  const tree = await gh(`/repos/${R}/git/trees/${commit.tree.sha}?recursive=1`);
  const files = new Map(); (tree.tree || []).forEach(t => { if (t.type === 'blob') files.set(t.path, t.sha); });
  remoteTree = { branch, head, tree: commit.tree.sha, files };
  return remoteTree;
}
async function readRemote(path, asJSON = true) {
  if (!remoteTree) await loadRemote();
  let sha = remoteTree.files.get(path);
  if (!sha) { await loadRemote(); sha = remoteTree.files.get(path); }
  if (!sha) return null;
  const r = await gh(`/repos/${repoPath()}/git/blobs/${sha}`, { raw: true, text: asJSON });
  return asJSON ? JSON.parse(r) : new Blob([r]);
}
async function commitWrites(writes, message) {
  const R = repoPath(); let i = 0;
  for (const w of writes) {
    if (w.blob) { i++; setSyncState('busy', `Envoi ${i} / ${writes.filter(x => x.blob).length}…`); w.sha = (await gh(`/repos/${R}/git/blobs`, { method: 'POST', body: { content: await b64OfBlob(w.blob), encoding: 'base64' } })).sha; }
  }
  const tree = await gh(`/repos/${R}/git/trees`, { method: 'POST', body: { base_tree: remoteTree.tree, tree: writes.map(w => ({ path: w.path, mode: '100644', type: 'blob', sha: w.sha || null })) } });
  const commit = await gh(`/repos/${R}/git/commits`, { method: 'POST', body: { message, tree: tree.sha, parents: [remoteTree.head] } });
  await gh(`/repos/${R}/git/refs/heads/${remoteTree.branch}`, { method: 'PATCH', body: { sha: commit.sha, force: false } });
}

// ── Fusion sans perte ──
function mergeSRSInto(remote) {
  let changed = false;
  for (const k in remote) {
    const l = SRS[k], r = remote[k];
    if (!l || (r.t || 0) > (l.t || 0) || (!r.t && !l.t && (r.c + r.w) > (l.c + l.w))) { SRS[k] = r; changed = true; }
  }
  return changed;
}
const volSig = v => hashStr(JSON.stringify([v.title, v.words.map(w => [w.fr || '', w.ign ? 1 : 0]), v.last || 0, v.bg || null, v.cloud || null]));
function volForCloud(v) { const c = Object.assign({}, v); delete c.hasImg; c.words = v.words.map(w => { const x = Object.assign({}, w); delete x.d; return x; }); return c; }
function mergeVolInto(l, r) {
  let changed = false; const rw = new Map(r.words.map(w => [w.jp, w]));
  for (const w of l.words) {
    const x = rw.get(w.jp); if (!x) continue;
    if (!w.fr && x.fr) { w.fr = x.fr; changed = true; }
    if (x.ign && !w.ign) { w.ign = true; changed = true; }
  }
  if ((r.last || 0) > (l.last || 0)) { l.last = r.last; changed = true; }
  if (r.bg && (!l.bg || (r.bg.t || 0) > (l.bg.t || 0))) { l.bg = r.bg; URLS.delete(l.id + ':bg'); changed = true; }
  if (r.cloud && JSON.stringify(r.cloud) !== JSON.stringify(l.cloud || null)) { l.cloud = Object.assign({}, l.cloud, r.cloud); changed = true; }
  return changed;
}
async function packImages(v, writes) {
  const JSZip = await getJSZip(), n = v.pages.length, parts = Math.ceil(n / PER_PART);
  for (let k = 0; k < parts; k++) {
    setSyncState('busy', `Préparation des pages de « ${v.title} » (${k + 1}/${parts})…`);
    const zip = new JSZip(); let any = false;
    for (let i = k * PER_PART; i < Math.min(n, (k + 1) * PER_PART); i++) {
      const b = await IDB.get('imgs', v.id + ':' + i).catch(() => null);
      if (b) { zip.file(i + '.jpg', b, { compression: 'STORE' }); any = true; }
    }
    if (any) writes.push({ path: `nihongo/vols/${v.id}-p${k}.zip`, blob: await zip.generateAsync({ type: 'blob', compression: 'STORE' }) });
  }
  v.cloud = Object.assign({}, v.cloud, { parts, per: PER_PART, n });
}
const partJobs = new Map();
async function cloudFetchPart(v, k) {
  if (!syncOn() || !v.cloud || k >= v.cloud.parts) return;
  const key = v.id + ':' + k;
  if (!partJobs.has(key)) partJobs.set(key, (async () => {
    const blob = await readRemote(`nihongo/vols/${v.id}-p${k}.zip`, false); if (!blob) return;
    const JSZip = await getJSZip(), zip = await JSZip.loadAsync(blob);
    for (const f of Object.values(zip.files)) { const i = parseInt(f.name); if (!isNaN(i)) await IDB.put('imgs', await f.async('blob'), v.id + ':' + i); }
  })().catch(e => { console.warn('pages du cloud', e); partJobs.delete(key); }));
  return partJobs.get(key);
}
async function cloudFetchBg(v) {
  if (!syncOn()) return null;
  try { const b = await readRemote(`nihongo/vols/${v.id}-bg.jpg`, false); if (b) { await IDB.put('imgs', b, v.id + ':bg'); return b; } } catch (e) { }
  return null;
}
async function removeVolLocal(v) {
  LIB = LIB.filter(x => x.id !== v.id);
  await IDB.del('vols', v.id).catch(() => { });
  await IDB.delRange('imgs', v.id + ':', v.id + ':￿').catch(() => { });
}

async function syncOnce() {
  setSyncState('busy', 'Synchronisation…');
  await loadRemote();
  const writes = [], files = remoteTree.files;
  // 1. progression
  const rp = await readRemote('nihongo/progress.json');
  const before = JSON.stringify(SRS);
  if (rp && rp.srs) mergeSRSInto(rp.srs);
  if (JSON.stringify(SRS) !== before) store('nihongo_srs', SRS);
  if (!rp || JSON.stringify(rp.srs) !== JSON.stringify(SRS)) writes.push({ path: 'nihongo/progress.json', blob: jsonBlob({ srs: SRS, by: SYNC.device, at: Date.now() }) });
  // 2. bibliothèque
  const lib = (await readRemote('nihongo/library.json')) || { vols: [], deleted: [], dicts: [], deletedDicts: [] };
  const deleted = new Set([...(lib.deleted || []), ...load('nihongo_deleted', [])]);
  const delDicts = new Set([...(lib.deletedDicts || []), ...load('nihongo_deleted_dicts', [])]);
  for (const id of deleted) {
    const v = LIB.find(x => x.id === id); if (v) await removeVolLocal(v);
    for (const p of files.keys()) if (p.startsWith(`nihongo/vols/${id}.`) || p.startsWith(`nihongo/vols/${id}-`)) writes.push({ path: p, sha: null });
  }
  const remoteVols = new Map((lib.vols || []).filter(x => !deleted.has(x.id)).map(x => [x.id, x]));
  const received = [];
  for (const [id, meta] of remoteVols) {
    let v = LIB.find(x => x.id === id);
    if (v && meta.sig === volSig(v)) continue;
    const rv = await readRemote(`nihongo/vols/${id}.json`); if (!rv) continue;
    if (!v) { rv.hasImg = 0; LIB.push(rv); received.push(rv); setSyncState('busy', `Reçu : ${rv.title}`); }
    else if (mergeVolInto(v, rv)) await IDB.put('vols', v);
  }
  for (const v of received) { if (DICTS.length) await fillMeanings(v); else await IDB.put('vols', v); }
  for (const v of LIB) {
    const meta = remoteVols.get(v.id);
    if (v.hasImg && !(v.cloud && v.cloud.n === v.pages.length && files.has(`nihongo/vols/${v.id}-p0.zip`))) await packImages(v, writes);
    if (v.bg && v.bg.type === 'custom' && !(v.cloud && v.cloud.bgT === v.bg.t)) {
      const b = await IDB.get('imgs', v.id + ':bg').catch(() => null);
      if (b) { writes.push({ path: `nihongo/vols/${v.id}-bg.jpg`, blob: b }); v.cloud = Object.assign({}, v.cloud, { bgT: v.bg.t }); }
    }
    if (!meta || meta.sig !== volSig(v)) { writes.push({ path: `nihongo/vols/${v.id}.json`, blob: jsonBlob(volForCloud(v)) }); await IDB.put('vols', v); }
  }
  LIB.sort((a, b) => b.date - a.date);
  // 3. dictionnaires
  const remoteDicts = (lib.dicts || []).filter(d => !delDicts.has(d.id));
  for (const id of delDicts) {
    if (files.has(`nihongo/dicts/${id}.zip`)) writes.push({ path: `nihongo/dicts/${id}.zip`, sha: null });
    if (DICTS.some(d => d.id === id)) await deleteDictionary(id, true);
  }
  for (const d of DICTS) {
    if (remoteDicts.some(x => x.id === d.id)) continue;
    const zip = await IDB.get('imgs', 'dict:' + d.id).catch(() => null);
    if (zip) { writes.push({ path: `nihongo/dicts/${d.id}.zip`, blob: zip }); remoteDicts.push({ id: d.id, title: d.title, count: d.count }); }
  }
  const newLib = { vols: LIB.map(v => ({ id: v.id, title: v.title, date: v.date, sig: volSig(v) })), deleted: [...deleted], dicts: remoteDicts, deletedDicts: [...delDicts] };
  const strip = o => JSON.stringify({ vols: o.vols || [], deleted: o.deleted || [], dicts: o.dicts || [], deletedDicts: o.deletedDicts || [] });
  if (strip(lib) !== strip(newLib)) writes.push({ path: 'nihongo/library.json', blob: jsonBlob(Object.assign(newLib, { at: Date.now() })) });
  if (writes.length) await commitWrites(writes, `synchro depuis ${SYNC.device}`);
  store('nihongo_deleted', []); store('nihongo_deleted_dicts', []);
  // 4. installer ici les dictionnaires présents dans le cloud
  for (const d of remoteDicts) {
    if (DICTS.some(x => x.id === d.id)) continue;
    setSyncState('busy', `Installation du dictionnaire « ${d.title} »…`);
    const zip = await readRemote(`nihongo/dicts/${d.id}.zip`, false);
    if (zip) { await importDictionary(zip, d); for (const v of LIB) await fillMeanings(v, true); }
  }
  return { received: received.length, sent: writes.length };
}
async function syncNow() {
  if (!syncOn()) return false;
  if (syncRunning) return syncRunning;
  clearTimeout(syncTimer); syncTimer = null;
  syncRunning = (async () => {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await syncOnce();
        SYNC.last = Date.now(); store('nihongo_sync', SYNC);
        setSyncState('ok', `Synchronisé à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}${r.received ? ` · ${r.received} manga(s) reçu(s)` : ''}`);
        if (r.received && S.tab === 'manga' && M.vol == null) renderManga();
        return true;
      } catch (e) {
        if (e.status === 422 && attempt < 2) { remoteTree = null; continue; }
        console.warn('synchro', e); setSyncState('err', syncErrMsg(e)); return false;
      }
    }
  })();
  try { return await syncRunning; } finally { syncRunning = null; }
}
function syncErrMsg(e) {
  if (!navigator.onLine) return 'Hors ligne : la synchro reprendra plus tard.';
  if (e.status === 'public') return 'Ce dépôt est PUBLIC : utilise un dépôt privé pour tes mangas.';
  if (e.status === 401) return 'Token refusé (expiré ou mal copié).';
  if (e.status === 404) return 'Dépôt introuvable : vérifie le nom et les droits du token.';
  if (e.status === 403) return 'GitHub refuse l\'accès (droits du token ou trop de requêtes, réessaie plus tard).';
  return 'Erreur de synchro : ' + (e.message || e.status || e);
}
function syncSoon() {
  if (!syncOn() || syncRunning) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 20000);
  setSyncState('pending', 'Modifications en attente de synchro…');
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && syncTimer) syncNow(); });
window.addEventListener('online', () => syncOn() && syncNow());

// ── Écran de synchro ──
function openSync() {
  hideSheet();
  const on = syncOn();
  $('syncContent').innerHTML = on ? `
    <div class="tip">Connecté au dépôt <b>${esc(repoPath())}</b> depuis cet appareil (<b>${esc(SYNC.device)}</b>).<br>
      Progression, mangas, pages, fonds et dictionnaires se synchronisent tout seuls. ${SYNC.last ? 'Dernière synchro : ' + new Date(SYNC.last).toLocaleString('fr-FR') + '.' : ''}</div>
    <div class="status" id="syncStatus">${esc(syncMsg)}</div>
    <button class="btn full" id="sNow">☁ Synchroniser maintenant</button>
    <div class="btn-row"><button class="btn ghost sm" id="sAll">⬇ Toutes les pages ici (hors ligne)</button><button class="btn ghost sm" id="sOff">Déconnecter</button></div>` : `
    <div class="tip"><b>Relie ton iPhone et tes ordinateurs.</b> Tes données vont dans un dépôt GitHub <b>privé</b> qui sert de coffre. Ton site (public) ne contient jamais tes mangas.</div>
    <div class="steps">
      <div><b>1.</b> Sur github.com : <i>New repository</i> → nom <code>nihongo-data</code> → <b>Private</b> → coche <i>Add a README</i> → <i>Create</i>.</div>
      <div><b>2.</b> Ta photo de profil → <i>Settings</i> → <i>Developer settings</i> → <i>Personal access tokens</i> → <i>Fine-grained tokens</i> → <i>Generate new token</i>.<br>
        Expiration : la plus longue · <i>Only select repositories</i> → <code>nihongo-data</code> · <i>Permissions → Contents</i> : <b>Read and write</b> → <i>Generate</i>, puis copie le token.</div>
      <div><b>3.</b> Colle-le ci-dessous, sur chaque appareil (le même token marche partout).</div></div>
    <input class="type-input" id="sRepo" placeholder="ton-pseudo/nihongo-data" value="${esc(SYNC.repo)}" style="width:100%;font-size:.85rem;margin:.6rem 0 .4rem">
    <input class="type-input" id="sToken" type="password" placeholder="github_pat_…" style="width:100%;font-size:.85rem;margin-bottom:.6rem">
    <button class="btn full" id="sGo">Connecter</button>
    <div class="status" id="syncStatus"></div>
    <div class="tip" style="margin-top:.6rem">Le token reste sur cet appareil et ne donne accès qu'à ce dépôt. Les comptes GitHub gratuits suffisent.</div>`;
  $('syncScreen').classList.add('show');
  if (on) {
    $('sNow').onclick = () => syncNow().then(() => openSync());
    $('sOff').onclick = () => { if (confirm('Déconnecter cet appareil ? Tes données restent ici et dans le dépôt.')) { SYNC.token = ''; store('nihongo_sync', SYNC); setSyncState('off', ''); openSync(); } };
    $('sAll').onclick = async () => {
      for (const v of LIB) if (v.cloud && v.cloud.parts) for (let k = 0; k < v.cloud.parts; k++) { setSyncState('busy', `Téléchargement de « ${v.title} » (${k + 1}/${v.cloud.parts})…`); await cloudFetchPart(v, k); }
      setSyncState('ok', 'Toutes les pages sont sur cet appareil.');
    };
  } else {
    $('sGo').onclick = async () => {
      SYNC.repo = $('sRepo').value.trim(); SYNC.token = $('sToken').value.trim();
      if (!SYNC.repo.includes('/') || !SYNC.token) return setSyncState('err', 'Indique « pseudo/dépôt » et le token.');
      setSyncState('busy', 'Connexion…');
      try { remoteTree = null; await loadRemote(); store('nihongo_sync', SYNC); const ok = await syncNow(); openSync(); if (ok) setSyncState('ok', syncMsg); }
      catch (e) { SYNC.token = ''; setSyncState('err', syncErrMsg(e)); }
    };
  }
}
function closeSync() { $('syncScreen').classList.remove('show'); render(); }
$('btnSync').onclick = openSync;
setSyncState(syncOn() ? 'ok' : 'off', syncOn() ? 'Connecté' : '');

</script>
<script>
// ═════════════ ÉCRAN DE PROGRESSION ═════════════
function openProgress() {
  hideSheet();
  const sets = [
    ['カタカナ', DATA.kata, x => x.jp, x => x.jp, false], ['ひらがな', DATA.hira, x => x.jp, x => x.jp, false],
    ['漢字 Kanji', DATA.kanji, x => x.jp, x => x.jp, false], ['熟語 Mots en kanji', DATA.kanjiWords, x => x.jp, x => x.jp, true],
    ['Mots japonais', DATA.hiraWords, x => x.jp + (x.jp === 'はな' || x.jp === 'かみ' ? '|' + x.fr : ''), x => x.jp, true],
    ['Mots empruntés', DATA.kataWords, x => x.jp, x => x.jp, true], ['Grammaire N5', DATA.grammarItems, x => x.key, x => x.answer, false]
  ];
  let tot = { 3: 0, 1: 0, 2: 0, 0: 0 }, due = 0;
  for (const k in SRS) { const m = mastery(k); if (m >= 0) tot[m]++; if (isDue(k)) due++; }
  let h = `<div class="stats"><div class="stat"><b class="c-green">${tot[3]}</b><span>Maîtrisés</span></div><div class="stat"><b style="color:var(--cyan)">${tot[2] + tot[1]}</b><span>En cours</span></div>
    <div class="stat"><b class="c-red">${tot[0]}</b><span>À revoir</span></div><div class="stat"><b class="c-gold">${due}</b><span>À réviser maintenant</span></div></div>
    <div class="legend"><span><i style="background:var(--surface);border:1px solid var(--border)"></i>Jamais vu</span><span><i style="background:var(--red)"></i>À revoir</span><span><i style="background:var(--gold)"></i>En cours</span><span><i style="background:var(--cyan)"></i>Bon</span><span><i style="background:var(--green)"></i>Maîtrisé</span></div>`;
  if (LIB.length) {
    h += `<div class="sec-title">漫画 Mes mangas</div>`;
    LIB.forEach(v => { const s = volStats(v); h += `<div class="vol"><div class="vol-info"><div class="vol-title">${esc(v.title)}</div><div class="vol-stats">${s.cov} % des mots connus · ${s.done} connus · ${s.learn} en révision</div><div class="minibar"><div style="width:${s.cov}%"></div></div></div></div>`; });
  }
  for (const [name, data, keyFn, disp, wide] of sets) {
    const seen = data.filter(x => mastery(keyFn(x)) >= 0).length;
    h += `<div class="sec-title">${name} · ${seen}/${data.length} vus</div><div class="grid" ${wide ? 'style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))"' : ''}>${data.map(x => { const m = mastery(keyFn(x));
      return `<div class="cell ${wide ? 'w' : ''} ${m >= 0 ? 'l' + m : ''}" title="${esc(x.fr || x.romaji || x.point || '')}">${esc(disp(x))}</div>`; }).join('')}</div>`;
  }
  h += `<div class="sec-title">Sauvegarde</div>
    <div class="tip">Ta progression est enregistrée dans ce navigateur. Pour la retrouver sur un autre appareil (PC ↔ iPhone), exporte-la ici puis importe le fichier de l'autre côté. Les images des mangas et le dictionnaire ne sont pas inclus : réimporte-les sur l'autre appareil.</div>
    <div class="btn-row"><button class="btn ghost" id="pExport">⬇ Exporter</button><button class="btn ghost" id="pImport">⬆ Importer</button></div>
    <input type="file" id="pFile" accept=".json" hidden>
    <button class="btn ko full" id="pReset" style="margin-top:.6rem">🗑 Tout effacer</button>`;
  $('progressContent').innerHTML = h;
  $('progressScreen').classList.add('show'); $('progressScreen').scrollTop = 0;
  $('pExport').onclick = () => {
    const vols = LIB.map(v => Object.assign({}, v, { hasImg: 0 }));
    const blob = new Blob([JSON.stringify({ app: 'nihongo-quiz', v: 3, srs: SRS, vols, settings: S })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `nihongo-progression-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $('pImport').onclick = () => $('pFile').click();
  $('pFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result); if (d.app !== 'nihongo-quiz') throw 0;
        if (!confirm('Remplacer la progression de cet appareil par celle du fichier ?')) return;
        SRS = d.srs || {}; saveSRS();
        const vols = d.vols || (d.manga || []).map(v => ({ id: v.id, title: v.title, date: v.date, hasImg: 0, last: 0, pages: [{ img: '', w: 0, h: 0, blocks: (v.lines || []).map(l => ({ box: null, v: false, fs: 0, t: l.t.map(x => [x[0], x[1], '']) })) }], words: v.words }));
        for (const v of vols) { const mine = LIB.find(x => x.id === v.id); if (mine) v.hasImg = mine.hasImg; await saveVol(v); }
        LIB = (await IDB.all('vols')).sort((a, b) => b.date - a.date);
        openProgress();
      } catch (_) { alert("Ce fichier n'est pas une sauvegarde du quiz."); }
    };
    r.readAsText(f);
  };
  $('pReset').onclick = async () => {
    if (!confirm("Effacer toute ta progression et ta bibliothèque manga (images comprises) ? C'est définitif.\nLe dictionnaire importé est gardé.")) return;
    SRS = {}; saveSRS(); LIB = []; await IDB.clear('vols').catch(() => { }); await IDB.clear('imgs').catch(() => { }); openProgress();
  };
}
function closeProgress() { $('progressScreen').classList.remove('show'); render(); updateDueBadge(); }
$('btnProgress').onclick = openProgress;

(async () => {
  await initManga(); render(); updateDueBadge();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (syncOn()) syncNow();
})();
